name: Build RootHide

on:
  workflow_dispatch:
    inputs:
      base_deb_url:
        description: "HTTPS URL for the verified VirtualMac_1.2.3.deb"
        required: false
        type: string
      publish_release:
        description: "Create/update the 0.0.1b (rh) GitHub release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "0.0.1b-rh"

permissions:
  contents: write

concurrency:
  group: roothide-build
  cancel-in-progress: true

jobs:
  validate-roothide-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RootHide scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n VirtualMac/scripts/build-ipad-deb-roothide.sh
          bash -n VirtualMac/scripts/development/prepare-roothide-sdk.sh
          bash -n VirtualMac/scripts/build-ipad-app.sh
          bash -n VirtualMac/scripts/build-vmm-compat.sh
          bash -n VirtualMac/vz/install/start-install.sh
          python3 -m py_compile VirtualMac/scripts/audit-roothide-package-stage.py
          python3 -m py_compile VirtualMac/vz/patches/add_macho_dylib.py

  build-roothide:
    needs: validate-roothide-scripts
    runs-on: macos-14
    env:
      VZ_IPADOS_MIN_VERSION: "16.0"
      BASE_URL_INPUT: ${{ github.event.inputs.base_deb_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 2>/dev/null || true
          brew bundle install --no-upgrade --file=VirtualMac/Brewfile
          for command_name in dpkg-deb ldid python3 xcrun curl unzip rsync; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "missing required command: $command_name" >&2
              exit 1
            }
          done

      - name: Acquire verified base runtime
        shell: bash
        env:
          VZ_BASE_DEB_URL: ${{ github.event.inputs.base_deb_url }}
        run: |
          set -euo pipefail
          mkdir -p VirtualMac/build/downloads
          base="VirtualMac/build/downloads/VirtualMac_1.2.3.deb"
          url="${VZ_BASE_DEB_URL:-}"
          if [[ -z "$url" ]]; then
            url="${VZ_DEFAULT_BASE_DEB_URL:-}"
          fi
          if [[ -n "$url" ]]; then
            curl --fail --location --retry 3 --output "$base.part" "$url"
            mv "$base.part" "$base"
          fi
          test -f "$base" || {
            echo "No base runtime supplied. Pass workflow_dispatch input base_deb_url or configure VZ_DEFAULT_BASE_DEB_URL." >&2
            exit 2
          }
          echo "Base SHA-256:"
          shasum -a 256 "$base"
          expected=435ce1dc76b9e18b1547c77b84e2cf33ffe40a16be63e366f181d14709a41aa0
          actual="$(shasum -a 256 "$base" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || {
            echo "Base runtime checksum mismatch." >&2
            exit 3
          }

      - name: Bootstrap RootHide SDK
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/development/prepare-roothide-sdk.sh
          VirtualMac/scripts/development/prepare-roothide-sdk.sh

      - name: Build RootHide package from base runtime
        env:
          VZ_ROOTHIDE: "1"
          VZ_PACKAGE_VERSION: "0.0.1b+rh"
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/build-ipad-deb-roothide.sh
          VZ_BASE_DEB=VirtualMac/build/downloads/VirtualMac_1.2.3.deb             VirtualMac/scripts/build-ipad-deb-roothide.sh

      - name: Audit package
        run: |
          set -euo pipefail
          deb="$(find VirtualMac/build/release-roothide -maxdepth 1 -name 'VirtualMac-RootHide-0.0.1b+rh.deb' -print -quit)"
          test -n "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | tee /tmp/roothide-package.txt
          grep -F "Applications/VirtualMac.app/" /tmp/roothide-package.txt
          grep -F "User/Library/VirtualMac/payload/" /tmp/roothide-package.txt
          ! grep -F "/var/jb/" /tmp/roothide-package.txt
          ! grep -F "/var/root/VirtualMac" /tmp/roothide-package.txt
          python3 VirtualMac/scripts/audit-roothide-package-stage.py VirtualMac/build/release-roothide/stage

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-RootHide-0.0.1b-rh
          path: VirtualMac/build/release-roothide/VirtualMac-RootHide-0.0.1b+rh.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/0.0.1b-rh') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 0.0.1b-rh
          name: "0.0.1b (rh)"
          prerelease: true
          generate_release_notes: true
          files: VirtualMac/build/release-roothide/VirtualMac-RootHide-0.0.1b+rh.deb
