name: Build RootHide

on:
  workflow_dispatch:
  push:
    branches: [roothide-port]

permissions:
  contents: read

jobs:
  build-roothide:
    runs-on: macos-14
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          dpkg-deb --version

      - name: Build RootHide package
        shell: bash
        env:
          VZ_ROOTHIDE: "1"
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/build-ipad-deb-roothide.sh
          VirtualMac/scripts/build-ipad-deb-roothide.sh

      - name: Audit RootHide package layout
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find VirtualMac/build/release-roothide -name '*.deb' -print | head -n1)"
          test -n "$deb"
          dpkg-deb -c "$deb" | tee /tmp/package-list.txt
          grep -F "Applications/VirtualMac.app/" /tmp/package-list.txt
          grep -F "User/Library/VirtualMac/payload/" /tmp/package-list.txt
          ! grep -F "/var/root/VirtualMac" /tmp/package-list.txt
          ! grep -F "/var/jb/" /tmp/package-list.txt

      - name: Upload RootHide package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-RootHide-deb
          path: VirtualMac/build/release-roothide/*.deb
          if-no-files-found: error
          retention-days: 14
