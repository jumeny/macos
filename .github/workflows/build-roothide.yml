name: Build RootHide

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag containing the RootHide source to build"
        required: true
        default: "roothide-port"
        type: string
      base_deb_url:
        description: "HTTPS URL for the base Virtual Mac .deb"
        required: true
        default: "https://github.com/nfzerox/VirtualMacOniPad/releases/download/1.2.3/VirtualMac_1.2.3.deb"
        type: string
      base_deb_sha256:
        description: "SHA-256 for the base .deb (leave blank only if you accept an unverified base)"
        required: false
        default: "435ce1dc76b9e18b1547c77b84e2cf33ffe40a16be63e366f181d14709a41aa0"
        type: string
      package_version:
        description: "RootHide Debian package version"
        required: true
        default: "0.0.1b+rh"
        type: string
      release_tag:
        description: "GitHub release tag to create/update"
        required: true
        default: "0.0.1b-rh"
        type: string
      release_name:
        description: "GitHub release name"
        required: true
        default: "0.0.1b (rh)"
        type: string
      publish_release:
        description: "Create/update the GitHub release and attach the built .deb"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: roothide-build-${{ inputs.release_tag }}
  cancel-in-progress: true

jobs:
  validate-roothide-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate RootHide scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n VirtualMac/scripts/build-ipad-deb-roothide.sh
          bash -n VirtualMac/scripts/development/prepare-roothide-sdk.sh
          bash -n VirtualMac/scripts/build-ipad-app.sh
          bash -n VirtualMac/scripts/build-vmm-compat.sh
          bash -n VirtualMac/vz/install/start-install.sh
          python3 -m py_compile VirtualMac/scripts/audit-roothide-package-stage.py
          python3 -m py_compile VirtualMac/vz/patches/add_macho_dylib.py

  build-roothide:
    needs: validate-roothide-scripts
    runs-on: macos-14
    env:
      VZ_IPADOS_MIN_VERSION: "16.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 2>/dev/null || true
          brew bundle install --no-upgrade --file=VirtualMac/Brewfile
          for command_name in dpkg-deb ldid python3 xcrun curl unzip rsync; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "missing required command: $command_name" >&2
              exit 1
            }
          done

      - name: Acquire base runtime
        env:
          VZ_BASE_DEB_URL: ${{ inputs.base_deb_url }}
          VZ_BASE_DEB_SHA256: ${{ inputs.base_deb_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p VirtualMac/build/downloads
          base="VirtualMac/build/downloads/VirtualMac_1.2.3.deb"
          curl --fail --location --retry 3 --output "$base.part" "$VZ_BASE_DEB_URL"
          mv "$base.part" "$base"
          actual="$(shasum -a 256 "$base" | awk "{print \$1}")"
          echo "Base SHA-256: $actual"
          if [[ -n "$VZ_BASE_DEB_SHA256" ]]; then
            [[ "$actual" == "$VZ_BASE_DEB_SHA256" ]] || {
              echo "Base runtime checksum mismatch." >&2
              echo "Expected: $VZ_BASE_DEB_SHA256" >&2
              echo "Actual:   $actual" >&2
              exit 3
            }
          else
            echo "::warning::No base SHA-256 was supplied; continuing with an unverified base package."
          fi

      - name: Bootstrap RootHide SDK
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/development/prepare-roothide-sdk.sh
          VirtualMac/scripts/development/prepare-roothide-sdk.sh

      - name: Build RootHide package from base runtime
        env:
          VZ_ROOTHIDE: "1"
          VZ_BASE_DEB: "VirtualMac/build/downloads/VirtualMac_1.2.3.deb"
          VZ_BASE_DEB_SHA256: ${{ inputs.base_deb_sha256 }}
          VZ_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/build-ipad-deb-roothide.sh
          if [[ -n "$VZ_BASE_DEB_SHA256" ]]; then
            VZ_BASE_DEB="$VZ_BASE_DEB" VZ_BASE_DEB_SHA256="$VZ_BASE_DEB_SHA256" VZ_PACKAGE_VERSION="$VZ_PACKAGE_VERSION" \
              VirtualMac/scripts/build-ipad-deb-roothide.sh
          else
            VZ_BASE_DEB="$VZ_BASE_DEB" VZ_BASE_DEB_SHA256="" VZ_ALLOW_UNVERIFIED_BASE=1 VZ_PACKAGE_VERSION="$VZ_PACKAGE_VERSION" \
              VirtualMac/scripts/build-ipad-deb-roothide.sh
          fi

      - name: Audit package
        env:
          VZ_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          deb="VirtualMac/build/release-roothide/VirtualMac-RootHide-$VZ_PACKAGE_VERSION.deb"
          test -f "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | tee /tmp/roothide-package.txt
          grep -F "Applications/VirtualMac.app/" /tmp/roothide-package.txt
          grep -F "User/Library/VirtualMac/payload/" /tmp/roothide-package.txt
          ! grep -F "/var/jb/" /tmp/roothide-package.txt
          ! grep -F "/var/root/VirtualMac" /tmp/roothide-package.txt
          python3 VirtualMac/scripts/audit-roothide-package-stage.py VirtualMac/build/release-roothide/stage

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-RootHide-${{ inputs.package_version }}
          path: VirtualMac/build/release-roothide/VirtualMac-RootHide-${{ inputs.package_version }}.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: VirtualMac/build/release-roothide/VirtualMac-RootHide-${{ inputs.package_version }}.deb
