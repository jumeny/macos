name: Build RootHide

on:
  workflow_dispatch:
  push:
    branches: [roothide-port]

permissions:
  contents: read

jobs:
  build-roothide:
    runs-on: macos-14
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project dependencies
        shell: bash
        env:
          HOMEBREW_BUNDLE_NO_UPGRADE: "1"
        run: |
          set -euo pipefail

          # The macOS 14 runner image can contain an old openssl@1.1
          # executable linked into /opt/homebrew/bin. The project's ldid
          # dependency uses openssl@3; remove only that stale link before
          # Homebrew Bundle installs the declared project dependencies.
          brew unlink openssl@1.1 2>/dev/null || true

          brew update

          # Homebrew 6+ requires explicit trust for third-party taps/formulas.
          # The project declares hudochenkov/sshpass in its Brewfile, so trust
          # that exact tap/formula before Bundle evaluates the Brewfile.
          brew tap hudochenkov/sshpass
          brew trust hudochenkov/sshpass
          brew trust --formula hudochenkov/sshpass/sshpass

          brew bundle install --no-upgrade --file=VirtualMac/Brewfile

          # Verify the commands used by the repository's build scripts.
          required_commands=(
            aria2c
            dpkg-deb
            gtar
            go
            idevice_id
            ldid
            python3
            rsync
            sshpass
            codesign
            ditto
            dwarfdump
            install_name_tool
            lipo
            otool
            plutil
            shasum
            sips
            iconutil
            xcrun
          )

          for command_name in "${required_commands[@]}"; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "ERROR: required build command is missing: $command_name" >&2
              exit 1
            }
          done

          echo "Installed project dependencies:"
          brew bundle list --file=VirtualMac/Brewfile
          echo
          echo "Tool versions:"
          dpkg-deb --version
          ldid -V || true
          go version
          python3 --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Bootstrap pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/bootstrap.sh
          VirtualMac/scripts/bootstrap.sh

          test -x VirtualMac/build/toolchain/venv/bin/python3
          test -x VirtualMac/build/toolchain/venv/bin/dyldex
          test -x VirtualMac/build/toolchain/bin/ipsw-a2sb

          VirtualMac/build/toolchain/venv/bin/python3 --version
          VirtualMac/build/toolchain/venv/bin/dyldex --help >/dev/null
          VirtualMac/build/toolchain/bin/ipsw-a2sb dyld a2sb --help >/dev/null

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
          clang --version

      - name: Build RootHide package
        shell: bash
        env:
          VZ_ROOTHIDE: "1"
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/build-ipad-deb-roothide.sh
          VirtualMac/scripts/build-ipad-deb-roothide.sh

      - name: Audit RootHide package layout
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find VirtualMac/build/release-roothide -name '*.deb' -print | head -n1)"
          test -n "$deb"
          dpkg-deb -c "$deb" | tee /tmp/package-list.txt
          grep -F "Applications/VirtualMac.app/" /tmp/package-list.txt
          grep -F "User/Library/VirtualMac/payload/" /tmp/package-list.txt
          ! grep -F "/var/root/VirtualMac" /tmp/package-list.txt
          ! grep -F "/var/jb/" /tmp/package-list.txt

      - name: Upload RootHide package
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-RootHide-deb
          path: VirtualMac/build/release-roothide/*.deb
          if-no-files-found: error
          retention-days: 14
