name: Build RootHide

on:
  workflow_dispatch:
    inputs:
      base_deb_url:
        description: "HTTPS URL for the base Virtual Mac .deb"
        required: true
        type: string
      package_version:
        description: "Debian package version (also used as the GitHub release tag and release name)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: roothide-build-${{ inputs.package_version }}
  cancel-in-progress: true

jobs:
  validate-roothide-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate RootHide scripts
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.base_deb_url }}" || {
            echo "base_deb_url must not be empty" >&2
            exit 1
          }
          test -n "${{ inputs.package_version }}" || {
            echo "package_version must not be empty" >&2
            exit 1
          }
          bash -n VirtualMac/scripts/build-ipad-deb-roothide.sh
          bash -n VirtualMac/scripts/development/prepare-roothide-sdk.sh
          bash -n VirtualMac/scripts/build-ipad-app.sh
          bash -n VirtualMac/scripts/build-vmm-compat.sh
          bash -n VirtualMac/vz/install/start-install.sh
          python3 -m py_compile VirtualMac/scripts/audit-roothide-package-stage.py
          python3 -m py_compile VirtualMac/vz/patches/add_macho_dylib.py

  build-roothide:
    needs: validate-roothide-scripts
    runs-on: macos-14
    env:
      VZ_IPADOS_MIN_VERSION: "16.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew unlink openssl@1.1 2>/dev/null || true
          brew bundle install --no-upgrade --file=VirtualMac/Brewfile
          for command_name in dpkg-deb ldid python3 xcrun curl unzip rsync; do
            command -v "$command_name" >/dev/null 2>&1 || {
              echo "missing required command: $command_name" >&2
              exit 1
            }
          done

      - name: Acquire base runtime
        env:
          VZ_BASE_DEB_URL: ${{ inputs.base_deb_url }}
        run: |
          set -euo pipefail
          mkdir -p VirtualMac/build/downloads
          base="VirtualMac/build/downloads/base-runtime.deb"
          curl --fail --location --retry 3 --output "$base.part" "$VZ_BASE_DEB_URL"
          mv "$base.part" "$base"
          dpkg-deb -I "$base" >/dev/null

      - name: Bootstrap RootHide SDK
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/development/prepare-roothide-sdk.sh
          VirtualMac/scripts/development/prepare-roothide-sdk.sh

      - name: Build RootHide package from base runtime
        env:
          VZ_ROOTHIDE: "1"
          VZ_BASE_DEB: "VirtualMac/build/downloads/base-runtime.deb"
          VZ_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          chmod +x VirtualMac/scripts/build-ipad-deb-roothide.sh
          VZ_BASE_DEB="$VZ_BASE_DEB" VZ_BASE_DEB_SHA256="" VZ_ALLOW_UNVERIFIED_BASE=1 VZ_PACKAGE_VERSION="$VZ_PACKAGE_VERSION" \
            VirtualMac/scripts/build-ipad-deb-roothide.sh

      - name: Audit package
        env:
          VZ_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          deb="VirtualMac/build/release-roothide/VirtualMac-RootHide-$VZ_PACKAGE_VERSION.deb"
          test -f "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | tee /tmp/roothide-package.txt
          grep -F "Applications/VirtualMac.app/" /tmp/roothide-package.txt
          grep -F "User/Library/VirtualMac/payload/" /tmp/roothide-package.txt
          ! grep -F "/var/jb/" /tmp/roothide-package.txt
          ! grep -F "/var/root/VirtualMac" /tmp/roothide-package.txt
          python3 VirtualMac/scripts/audit-roothide-package-stage.py VirtualMac/build/release-roothide/stage

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualMac-RootHide-${{ inputs.package_version }}
          path: VirtualMac/build/release-roothide/VirtualMac-RootHide-${{ inputs.package_version }}.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.package_version }}
          name: ${{ inputs.package_version }}
          prerelease: true
          generate_release_notes: true
          files: VirtualMac/build/release-roothide/VirtualMac-RootHide-${{ inputs.package_version }}.deb
